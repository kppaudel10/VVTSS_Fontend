<div class="ml-4">
<form>
<c-row>
    <c-row class="mt-3">
        <label cLabel="col" class="col-sm-1">Password :</label>
        <c-col [sm]="4">
            <input cFormControl id="inputPassword" type="password" />
        </c-col>
    </c-row>

    <c-row class="mt-3">
        <label cLabel="col" class="col-sm-1">Brows :</label>
        <c-col [sm]="4">
            <input cFormControl type="file" />
        </c-col>
    </c-row>

    <c-row class="mt-3">
        <label cLabel="col" class="col-sm-1">K Value :</label>
        <c-col [sm]="2">
            <input cFormControl type="number" value="3"/>
        </c-col>
    </c-row>
    <div class="mt-4">
        <button cButton color="success">Train</button>
    </div>
</c-row>
</form>
</div>
