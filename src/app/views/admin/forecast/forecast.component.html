<div class="ml-4 side">
    <form cForm>
        <c-row>
            <c-row class="mt-3">
                <label cLabel="col" class="col-sm-1">Browse :</label>
                <c-col [sm]="4">
                    <input type="file" cFormControl />
                </c-col>
            </c-row>

            <c-row class="mt-3">
                <label cLabel="col" class="col-sm-1">Day :</label>
                <c-col [sm]="4">
                    <input type="text" cFormControl placeholder="dd/mm/yyyy" />
                </c-col>
            </c-row>
            <c-row class="mt-3">
                <label cLabel="col" class="col-sm-1">Time Interval :</label>
                <c-col [sm]="4">
                    <input type="text" cFormControl />
                </c-col>
            </c-row>
            <c-col class=" mt-4 btns">
                <button cButton [cModalToggle]="verticallyCenteredModal.id" color="success">Forecast</button>
                <button class="bigbot" [cModalToggle]="verticallyCenteredScrollableModal.id" cButton color="success">Forecast In Big Mode</button>
            </c-col>
        </c-row>
        
    </form>

    <c-modal #verticallyCenteredModal alignment="center" id="verticallyCenteredModal">
        <c-modal-header>
          <h5 cModalTitle>Modal title</h5>
          <button [cModalToggle]="verticallyCenteredModal.id" cButtonClose></button>
        </c-modal-header>
        <c-modal-body>
          Woohoo, you are reading this text in a modal!
        </c-modal-body>
        <c-modal-footer>
          <button [cModalToggle]="verticallyCenteredModal.id" cButton color="secondary">
            Close
          </button>
          <button cButton color="primary">Save</button>
        </c-modal-footer>
      </c-modal>


      <c-modal #verticallyCenteredScrollableModal
      [scrollable]="true"
      alignment="center"
      id="verticallyCenteredScrollableModal">
<c-modal-header>
 <h5 cModalTitle>Modal title</h5>
 <button [cModalToggle]="verticallyCenteredScrollableModal.id" cButtonClose></button>
</c-modal-header>
<c-modal-body>
 <p>
    max-height of modal, content will be cropped and scrollable within the modal.
 </p>
 
 <p>Just like that.</p>
</c-modal-body>
<c-modal-footer>
 <button [cModalToggle]="verticallyCenteredScrollableModal.id" cButton color="secondary">
   Close
 </button>
 <button cButton color="primary">Save</button>
</c-modal-footer>
</c-modal>

    </div>
