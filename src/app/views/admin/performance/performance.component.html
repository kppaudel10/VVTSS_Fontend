<div *ngIf="!isLoading; else loadingTemplate">
  <c-chart
    type="line" style="cursor: pointer;"
    [data]="lineChartData"
    [options]="lineChartOptions"></c-chart>
</div>

<!-- Loading spinner -->
<ng-template #loadingTemplate>
  <div>Loading...</div>
</ng-template>

<!-- Error message -->
<div *ngIf="errorMessage">
  <p style="color: red;">{{ errorMessage }}</p>
</div>
